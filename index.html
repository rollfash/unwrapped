<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Unwrapped — your year in music, early</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #2438d6; --ink: #161a52; --pink: #ff5c8a; --sun: #ffd23f;
    --mint: #7fe0b8; --flame: #ff6a3d; --lilac: #c9a7ff; --paper: #fff8ea;
    --display: "Karantina", "Arial Narrow", sans-serif;
    --body: "Rubik", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--ink); font-family: var(--body); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  [hidden] { display: none !important; }

  .stage { position: relative; width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--bg, var(--cobalt)); color: var(--fg, var(--sun)); }

  /* ---------- setup ---------- */
  .setup { height: 100%; overflow-y: auto; padding: 28px 24px 40px; }
  .setup h1 { font-family: var(--display); font-weight: 700; font-size: clamp(4.5rem, 24vw, 7.5rem); line-height: .8; margin-top: 8px; overflow-wrap: anywhere; }
  .setup .lede { margin: 18px 0 28px; max-width: 34ch; font-size: 1.05rem; color: var(--paper); }
  .steps { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 22px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 10px; color: var(--paper); }
  .steps li::before { content: counter(s); font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: .8; color: var(--sun); grid-row: span 3; }
  .steps a { color: var(--sun); }
  .steps small { opacity: .8; }
  .field { display: flex; gap: 8px; margin-top: 8px; }
  .field input, .field code { flex: 1; min-width: 0; padding: 12px; border: 2px solid var(--paper); border-radius: 4px; background: transparent; color: var(--paper); font-family: ui-monospace, Menlo, monospace; font-size: .85rem; overflow-wrap: anywhere; }
  .field input::placeholder { color: var(--paper); opacity: .5; }
  .btn { border: 2px solid currentColor; border-radius: 4px; background: transparent; padding: 12px 16px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.solid { background: var(--sun); border-color: var(--sun); color: var(--ink); width: 100%; margin-top: 10px; padding: 16px; font-size: 1.05rem; }
  .linkish { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; color: var(--paper); margin-top: 22px; }
  .msg { margin-top: 18px; padding: 12px 14px; background: var(--paper); color: var(--ink); border-left: 8px solid var(--pink); border-radius: 2px; }

  /* ---------- stories ---------- */
  .bars { position: absolute; z-index: 5; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: currentColor; opacity: .28; }
  .bars i.on { opacity: 1; }
  .ranges { position: absolute; z-index: 5; top: 24px; left: 12px; display: flex; border: 2px solid currentColor; border-radius: 4px; overflow: hidden; }
  .ranges button { border: 0; background: transparent; padding: 6px 10px; font-size: .8rem; font-weight: 500; cursor: pointer; }
  .ranges button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .nav { position: absolute; z-index: 2; top: 0; bottom: 0; border: 0; background: transparent; cursor: pointer; }
  .nav.prev { left: 0; width: 32%; } .nav.next { right: 0; width: 68%; }
  .nav:focus-visible { outline-offset: -6px; }

  .slide { position: absolute; inset: 0; padding: 78px 24px 32px; display: flex; flex-direction: column; justify-content: flex-end; }
  .slide > * { position: relative; }
  .slide .act { z-index: 3; } /* anything tappable sits above the nav zones */
  .kicker { font-size: 1rem; font-weight: 500; margin-bottom: 10px; }
  .big { font-family: var(--display); font-weight: 700; line-height: .82; font-size: clamp(5.5rem, 31vw, 10rem); overflow-wrap: anywhere; text-wrap: balance; }
  .big.m { font-size: clamp(4.4rem, 24vw, 7.6rem); } .big.s { font-size: clamp(3.4rem, 17vw, 5.4rem); line-height: .88; }
  [dir="auto"] { text-align: left; }
  .sub { margin-top: 14px; font-size: 1.05rem; max-width: 32ch; }
  @media (prefers-reduced-motion: no-preference) {
    .slide .big { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { clip-path: inset(100% 0 0 0); transform: translateY(18px); } to { clip-path: inset(-10% 0 -10% 0); transform: none; } }
  }

  /* photo printed in two inks: grey image multiplied onto the paper colour, shadows lifted to the ink colour */
  .print { position: relative; isolation: isolate; align-self: flex-start; width: min(78%, 46dvh); aspect-ratio: 1; margin-bottom: 22px; background: var(--paper); transform: rotate(-3deg); box-shadow: 10px 10px 0 var(--fg); }
  .print img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.25); mix-blend-mode: multiply; }
  .print::after { content: ""; position: absolute; inset: 0; background: var(--fg); mix-blend-mode: screen; }

  .setlist { list-style: none; padding: 0; margin-top: 18px; display: grid; gap: 12px; }
  .setlist li { display: grid; grid-template-columns: 2.4rem 1fr; align-items: baseline; column-gap: 8px; }
  .setlist .n { font-family: var(--display); font-weight: 700; font-size: 3.6rem; line-height: .8; }
  .setlist .t { font-family: var(--display); font-weight: 700; font-size: 3.1rem; line-height: .86; overflow-wrap: anywhere; }
  .setlist .a { grid-column: 2; font-size: .9rem; opacity: .85; }

  .genres { display: grid; gap: 2px; margin-top: 14px; }
  .genres span { font-family: var(--display); font-weight: 700; line-height: .86; overflow-wrap: anywhere; }

  .card { background: var(--paper); color: var(--ink); padding: 18px; border-radius: 2px; box-shadow: 10px 10px 0 var(--sun); }
  .card h2 { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: .85; }
  .card .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .card h3 { font-size: .85rem; font-weight: 700; margin-bottom: 4px; }
  .card ol { padding-left: 1.2em; font-size: .9rem; }
  .card li { overflow-wrap: anywhere; }
  .card .g { margin-top: 12px; font-size: .9rem; }
  .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .fine { margin-top: 12px; font-size: .8rem; opacity: .85; max-width: 44ch; }
  .loading { height: 100%; display: grid; place-items: center; font-family: var(--display); font-size: 3rem; }
</style>
</head>
<body>
<main class="stage" id="stage"></main>
<script>
"use strict";
const REDIRECT = location.origin + location.pathname;
const RANGES = [["short_term", "4 weeks"], ["medium_term", "6 months"], ["long_term", "1 year"]];
const LS = { get: k => { try { return localStorage.getItem("uw_" + k); } catch { return null; } },
             set: (k, v) => { try { v == null ? localStorage.removeItem("uw_" + k) : localStorage.setItem("uw_" + k, v); } catch {} } };
const stage = document.getElementById("stage");

// tiny DOM builder; strings always go in as text, never as HTML (Spotify names are untrusted)
function h(tag, props, ...kids) {
  const el = Object.assign(document.createElement(tag), props || {});
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

// ---------- Spotify login (authorization code + PKCE, no secret, nothing leaves the browser) ----------
async function login(clientId) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  LS.set("client", clientId); LS.set("verifier", verifier); LS.set("state", state);
  location.assign("https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: clientId, response_type: "code", redirect_uri: REDIRECT, scope: "user-top-read",
    code_challenge_method: "S256", code_challenge: challenge, state }));
}

async function finishLogin(q) {
  history.replaceState(null, "", REDIRECT); // drop ?code from the address bar
  if (q.get("error")) throw new Error("Spotify login was cancelled (" + q.get("error") + ").");
  if (!LS.get("state") || q.get("state") !== LS.get("state")) throw new Error("Login didn't start from this page. Connect again.");
  const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT,
      client_id: LS.get("client"), code_verifier: LS.get("verifier") }) });
  const j = await r.json().catch(() => ({}));
  LS.set("verifier", null); LS.set("state", null);
  if (!r.ok) throw new Error("Spotify refused the login: " + (j.error_description || j.error || r.status) + ".");
  // shortcut: no refresh token, a login lasts 1 hour; add refresh if sessions need to outlive that
  LS.set("token", j.access_token); LS.set("expires", String(Date.now() + j.expires_in * 1000));
}
const token = () => (Number(LS.get("expires")) > Date.now() + 5000 ? LS.get("token") : null);
function disconnect() { LS.set("token", null); LS.set("expires", null); showSetup(); }

async function api(path) {
  const r = await fetch("https://api.spotify.com/v1" + path, { headers: { Authorization: "Bearer " + token() } });
  if (r.status === 401) { LS.set("token", null); throw new Error("Your Spotify login expired. Connect again."); }
  if (r.status === 403) throw new Error("Spotify blocked the request. The account that made the Client ID needs Premium, and any other account has to be added under User Management in the Spotify dashboard.");
  if (r.status === 429) throw new Error("Spotify is rate-limiting this app. Try again in a minute.");
  if (!r.ok) { const e = new Error("Spotify returned an error (" + r.status + ")."); e.status = r.status; throw e; }
  return r.json();
}
const topItems = (type, range) => api(`/me/top/${type}?time_range=${range}&limit=50`)
  .catch(e => { if (e.status === 400) return api(`/me/top/${type}?time_range=${range}`); throw e; }) // in case the limit cap changes
  .then(j => j.items || []);

// Genres ranked by how high the artists carrying them sit in your list
function topGenres(artists, n = 5) {
  const score = new Map();
  artists.forEach((a, i) => (a.genres || []).forEach(g => score.set(g, (score.get(g) || 0) + artists.length - i)));
  return [...score].sort((a, b) => b[1] - a[1]).slice(0, n).map(([name, s]) => ({ name, s }));
}

// ---------- demo data (invented artists) ----------
function demoData() {
  const pic = (a, b) => [{ url: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#bbb"/><circle cx="${a}" cy="${b}" r="38" fill="#333"/><circle cx="${100 - a}" cy="${100 - b}" r="22" fill="#eee"/></svg>`) }];
  const A = [["Paper Lanterns", ["indie pop", "dream pop"]], ["נמל תעופה", ["israeli indie", "indie pop"]], ["Glass Harbor", ["synthwave"]], ["Odd Tuesday", ["bedroom pop", "indie pop"]], ["The Night Buses", ["post-punk"]], ["Marlo Vance", ["neo soul"]]];
  const artists = A.map(([name, genres], i) => ({ name, genres, images: pic(30 + i * 8, 40 + i * 5) }));
  const T = [["Half Moon Motel", 0], ["לילה לבן", 1], ["Static Summer", 2], ["Kitchen Floor", 3], ["Last Train to Nowhere in Particular", 4], ["Velvet", 5]];
  const tracks = T.map(([name, i]) => ({ name, artists: [{ name: A[i][0] }], album: { images: pic(60 - i * 6, 35 + i * 7) } }));
  return { me: { display_name: "Demo listener" }, artists, tracks };
}

// ---------- screens ----------
function paint(bg, fg) { stage.style.setProperty("--bg", `var(--${bg})`); stage.style.setProperty("--fg", `var(--${fg})`); }

function showSetup(message) {
  paint("cobalt", "sun");
  const input = h("input", { id: "cid", placeholder: "Client ID", autocomplete: "off", spellcheck: false, value: LS.get("client") || "" });
  input.setAttribute("aria-label", "Spotify Client ID");
  const copy = h("button", { className: "btn", type: "button", textContent: "Copy" });
  copy.onclick = () => navigator.clipboard.writeText(REDIRECT).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select it"; });
  const form = h("form", null, h("div", { className: "field" }, input), h("button", { className: "btn solid", textContent: "Connect Spotify" }));
  form.onsubmit = e => {
    e.preventDefault();
    const id = input.value.trim();
    if (!/^[0-9a-f]{32}$/i.test(id)) return showSetup("That doesn't look like a Client ID. It's 32 letters and numbers, on your app's page in the Spotify dashboard.");
    login(id);
  };
  const link = (href, text) => h("a", { href, target: "_blank", rel: "noopener", textContent: text });
  stage.replaceChildren(h("div", { className: "setup" },
    h("h1", null, "Unwrapped"),
    h("p", { className: "lede" }, "Your top artists, songs and genres of the year, without waiting for December."),
    message ? h("p", { className: "msg", role: "alert" }, message) : null,
    h("ol", { className: "steps" },
      h("li", null, h("span", null, "Create an app in the ", link("https://developer.spotify.com/dashboard", "Spotify developer dashboard"), ". Any name works. Tick “Web API”."),
        h("small", null, "Spotify only allows this on Premium accounts.")),
      h("li", null, h("span", null, "Paste this as the app's Redirect URI and save."),
        h("div", { className: "field" }, h("code", null, REDIRECT), copy)),
      h("li", null, h("span", null, "Paste the app's Client ID here."), form)),
    h("button", { className: "linkish", type: "button", textContent: "See a demo with made-up music first", onclick: () => showStories(demoData, true) }),
    h("p", { className: "fine" }, "Your Client ID and login stay in this browser. This page has no server.")));
}

async function showStories(load, demo) {
  let range = "long_term", i = 0, slides = [];
  paint("cobalt", "sun");
  stage.replaceChildren(h("div", { className: "loading" }, "Reading your year…"));
  const build = d => {
    const { me, artists, tracks } = d, genres = topGenres(artists);
    const label = RANGES.find(r => r[0] === range)[1];
    const size = s => "big" + (s.length > 22 ? " s" : s.length > 11 ? " m" : "");
    const name = (cls, text) => h("div", { className: cls, dir: "auto" }, text);
    const img = list => (list && list[0] ? h("div", { className: "print" }, h("img", { src: list[0].url, alt: "" })) : null);
    const who = t => t.artists.map(a => a.name).join(", ");
    const out = [];
    out.push(["cobalt", "sun", () => [
      h("p", { className: "kicker" }, "Hi " + (me.display_name || "there") + (demo ? " (demo)" : "")),
      h("h1", { className: "big m" }, range === "long_term" ? "Your year in music, early" : "Your last " + label + " in music"),
      h("p", { className: "sub" }, "Ranked by Spotify from what you played most over about the last " + label + ". Tap the right side to go on.")]]);
    if (!artists.length && !tracks.length) {
      out.push(["sun", "ink", () => [h("h1", { className: "big m" }, "Not enough listening yet"), h("p", { className: "sub" }, "Spotify has no ranking for this period. Pick another period at the top.")]]);
      return out;
    }
    if (artists[0]) out.push(["pink", "ink", () => [img(artists[0].images), h("p", { className: "kicker" }, "Your number one artist"), name(size(artists[0].name), artists[0].name)]]);
    if (artists.length > 1) out.push(["sun", "ink", () => [h("p", { className: "kicker" }, "Your top artists"),
      h("ol", { className: "setlist" }, artists.slice(0, 5).map((a, k) => h("li", null, h("span", { className: "n" }, k + 1), name("t", a.name))))]]);
    if (tracks[0]) out.push(["mint", "ink", () => [img(tracks[0].album && tracks[0].album.images), h("p", { className: "kicker" }, "The song you couldn't leave alone"),
      name(size(tracks[0].name), tracks[0].name), name("sub", who(tracks[0]))]]);
    if (tracks.length > 1) out.push(["flame", "ink", () => [h("p", { className: "kicker" }, "Your top songs"),
      h("ol", { className: "setlist" }, tracks.slice(0, 5).map((t, k) => h("li", null, h("span", { className: "n" }, k + 1), name("t", t.name), name("a", who(t)))))]]);
    if (genres.length) out.push(["lilac", "ink", () => [h("p", { className: "kicker" }, "What it all sounded like"),
      h("div", { className: "genres" }, genres.map((g, k) => h("span", { dir: "auto", style: `font-size:${[6.4, 4.8, 3.8, 3, 2.5][k]}rem`, textContent: g.name })))]]);
    out.push(["cobalt", "paper", () => [
      h("div", { className: "card" }, h("h2", null, (me.display_name || "My") + (me.display_name ? "’s " : " ") + (range === "long_term" ? "year so far" : "last " + label)),
        h("div", { className: "cols" },
          h("div", null, h("h3", null, "Top artists"), h("ol", null, artists.slice(0, 5).map(a => h("li", null, h("bdi", null, a.name))))),
          h("div", null, h("h3", null, "Top songs"), h("ol", null, tracks.slice(0, 5).map(t => h("li", null, h("bdi", null, t.name)))))),
        genres[0] ? h("p", { className: "g" }, "Top genre: ", h("strong", null, genres[0].name)) : null),
      h("div", { className: "row act" },
        h("button", { className: "btn", type: "button", textContent: "Start over", onclick: () => go(0) }),
        h("button", { className: "btn", type: "button", textContent: demo ? "Back to setup" : "Disconnect", onclick: disconnect })),
      h("p", { className: "fine" }, "Take a screenshot to share. Spotify doesn't give apps minutes listened or play counts, so those only arrive with the real Wrapped.")]]);
    return out;
  };
  const go = n => {
    i = Math.max(0, Math.min(slides.length - 1, n));
    const [bg, fg, body] = slides[i];
    paint(bg, fg);
    stage.replaceChildren(
      h("div", { className: "bars" }, slides.map((_, k) => h("i", { className: k <= i ? "on" : "" }))),
      h("div", { className: "ranges", role: "group", ariaLabel: "Period" }, RANGES.map(([key, text]) => {
        const b = h("button", { type: "button", textContent: text, onclick: () => { range = key; start(); } });
        b.setAttribute("aria-pressed", String(key === range));
        return b;
      })),
      h("section", { className: "slide" }, body()),
      h("button", { className: "nav prev", ariaLabel: "Previous", onclick: () => go(i - 1) }),
      h("button", { className: "nav next", ariaLabel: "Next", onclick: () => go(i + 1) }));
  };
  const start = async () => {
    try { slides = build(await load(range)); go(0); }
    catch (e) { slides = []; showSetup(e.message); }
  };
  document.onkeydown = e => { if (!slides.length) return; if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); };
  start();
}

const loadReal = async range => {
  const [me, artists, tracks] = await Promise.all([api("/me"), topItems("artists", range), topItems("tracks", range)]);
  return { me, artists, tracks };
};

(async function boot() {
  const q = new URLSearchParams(location.search);
  try {
    if (q.has("code") || q.has("error")) await finishLogin(q);
  } catch (e) { return showSetup(e.message); }
  if (q.has("demo")) return showStories(demoData, true);
  token() ? showStories(loadReal, false) : showSetup();
})();
</script>
</body>
</html>
