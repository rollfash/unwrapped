<body>
<main class="stage" id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="bd" aria-hidden="true"></div>
  <div id="ui"></div>
</main>
<audio id="player" playsinline></audio>
<script>
"use strict";
const REDIRECT = location.origin + location.pathname;
const CLIENT_ID = "2a8de54d94274bdc9085594f1f1ebd84"; // public by design: this kind of login (PKCE) has no secret
const RANGES = [["short_term", "4 weeks"], ["medium_term", "6 months"], ["long_term", "1 year"]];
const LS = { get: k => { try { return localStorage.getItem("uw_" + k); } catch { return null; } },
             set: (k, v) => { try { v == null ? localStorage.removeItem("uw_" + k) : localStorage.setItem("uw_" + k, v); } catch {} } };
const stage = document.getElementById("stage"), ui = document.getElementById("ui");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!reduced) { const r = stage.getBoundingClientRect(), dot = h("i", { className: "tap" }); dot.style.left = e.clientX - r.left + "px"; dot.style.top = e.clientY - r.top + "px"; stage.append(dot); setTimeout(() => dot.remove(), 650); } };
    b.onpointerup = b.onpointercancel = b.onpointerleave = () => { clearTimeout(t); stage.classList.remove("held"); };
    b.onclick = e => { if (held) return void (held = false); // a long press only pauses
      if (step > 0 && performance.now() - autoAt < 350) return; // the story moved on by itself just as you tapped: don't skip a screen
      go(i + step, e); };
    b.oncontextmenu = e => e.preventDefault();
    return b;
  };
  const muteBtn = () => {
    const b = h("button", { className: "mute glass act", type: "button", ariaLabel: "Mute clips" });
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path class="cross" d="M17 9.5l5 5m0-5l-5 5"/></svg>';
    b.setAttribute("aria-pressed", String(Sound.muted));
    b.onclick = () => b.setAttribute("aria-pressed", String(Sound.toggle()));
    return b;
  };
  // a small label that always names the clip you're hearing
  const nowPill = () => h("div", { className: "nowp glass", hidden: true }, icon("eq", EQ), h("span", { className: "nt", dir: "auto" }));
  const drawNow = () => { const el = ui.querySelector(".nowp"), c = Sound.now(); if (!el) return;
    el.hidden = !c; if (c) el.lastChild.replaceChildren(h("bdi", null, c.title), c.artist ? h("span", { className: "na" }, " — ", h("bdi", null, c.artist)) : ""); };
  function go(n, e) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (waiting || !slides.length || (n === i && e)) return;
    const s = slides[n];
    if (s.clip !== undefined) Sound.play(s.clip);
    if (e) { // inside the tap, so the phone lets sound start and can be asked for its motion sensor
      Sound.unlock();
      const ask = Tilt.start();
      if (ask) { waiting = true; return void ask.then(() => { waiting = false; go(n); }); } // hold the story until the phone's question is answered
    }
    if (leave) { leave(); leave = null; }
    i = n;
    paint(s.pal); GL.kick(); setBackdrop(s.bd);
    ui.className = s.dur && !reduced ? "" : "noauto"; ui.style.setProperty("--dur", (s.dur || 0) + "s");
    // the outgoing slide stays put and dissolves while the new one arrives over it
    const old = ui.querySelector(".slide:not(.out)");
    for (const c of [...ui.children]) if (c !== old) c.remove();
    if (old) { if (reduced) old.remove(); else { old.classList.add("out"); setTimeout(() => old.remove(), 460); } }
    const cur = h("b"), slide = h("section", { className: "slide " + (s.cls || "") }, s.body());
    ui.append(h("div", { className: "bars" }, slides.map((_, k) => h("i", { className: k < i ? "done" : k === i ? "cur" : "" }, k === i ? cur : h("b")))),
      nowPill(), muteBtn(), slide, nav("prev", "Previous", -1), nav("next", "Next", 1));
    drawNow();
    cur.onanimationend = () => { autoAt = performance.now(); go(i + 1); };
    slide.querySelectorAll(".big").forEach(fit);
    if (s.enter) leave = s.enter(slide);
    const sb = slide.querySelector(".scrub b"); // thin line that follows the clip
    if (sb) { const iv = setInterval(() => { sb.style.transform = `scaleX(${Sound.progress()})`; }, 250), prev = leave; leave = () => { clearInterval(iv); if (prev) prev(); }; }
  }
  const start = async () => {
    try { Sound.play(null); const next = build(await load(range));
      // pictures and the first clips are fetched before the story opens: nothing pops in late, and the Play tap can start sound at once
      await Promise.all([preload(pre), Promise.race([Promise.all(looking), new Promise(r => setTimeout(r, 5000))])]);
      slides = next; go(0); }
    catch (e) { showSetup(e.message); }
  };
  const onKey = e => { if (!slides.length) return; if (e.key === "ArrowRight") go(i + 1, e); if (e.key === "ArrowLeft") go(i - 1, e); };
  const onHide = () => stage.classList.toggle("held", document.hidden);
  document.addEventListener("keydown", onKey); document.addEventListener("visibilitychange", onHide); stage.addEventListener("clip", drawNow);
  closeStories = () => { if (leave) leave(); slides = []; stage.classList.remove("held");
    document.removeEventListener("keydown", onKey); document.removeEventListener("visibilitychange", onHide); stage.removeEventListener("clip", drawNow); };
  start();
}

const loadReal = async range => {
  const [me, artists, tracks, recent] = await Promise.all([api("/me"), topItems("artists", range), topItems("tracks", range),
    range === "short_term" ? [] : topItems("tracks", "short_term").catch(() => [])]); // for the "lately" screen; the story works without it
  return { me, artists, tracks, recent };
};

(async function boot() {
  const q = new URLSearchParams(location.search);
  try {
    if (q.has("code") || q.has("error")) await finishLogin(q);
  } catch (e) { return showSetup(e.message); }
  if (q.has("demo")) return showStories(demoLive, true);
  token() || LS.get("refresh") ? showStories(loadReal, false) : showSetup();
})();
</script>
