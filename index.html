<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Unwrapped — your year in music, early</title>
<style>
  :root {
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --t2: rgba(255, 255, 255, .66); --t3: rgba(255, 255, 255, .44);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #000; color: #fff; font-family: var(--sf); line-height: 1.4; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .stage { position: relative; isolation: isolate; width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; }

  /* frosted glass: blur what is behind, a lit top edge, a hairline all round */
  .glass { background: rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 0 1px rgba(255, 255, 255, .08), 0 18px 48px rgba(0, 0, 0, .32); }

  .in { animation: in .9s var(--ease) both; animation-delay: var(--d, 0ms); }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }

  /* headlines come into focus word by word */
  .big { font-weight: 700; font-size: clamp(2.7rem, 12.6vw, 3.9rem); line-height: 1.03; letter-spacing: -.038em; }
  .big.m { font-size: clamp(2.2rem, 10vw, 3rem); }
  .big.s { font-size: clamp(1.8rem, 8vw, 2.3rem); line-height: 1.08; }
  .big.brk .w { white-space: normal; overflow-wrap: anywhere; }
  .w { display: inline-block; white-space: nowrap; animation: word 1s var(--ease) both; animation-delay: calc(var(--i) * 90ms + var(--d, 150ms)); }
  @keyframes word { from { opacity: 0; transform: translateY(.3em); filter: blur(12px); } }
  .kicker { font-size: .95rem; font-weight: 600; color: color-mix(in srgb, var(--tint, #fff) 26%, #fff); margin-bottom: 8px; }
  .sub { margin-top: 10px; font-size: 1.15rem; font-weight: 500; color: var(--t2); }
  .fine { margin-top: 14px; font-size: .8rem; line-height: 1.45; color: var(--t3); max-width: 46ch; }

  .btn { height: 50px; padding: 0 22px; border: 0; border-radius: 999px; font-weight: 600; font-size: 1.02rem; cursor: pointer; white-space: nowrap; transition: transform .2s var(--ease); }
  .btn:active { transform: scale(.96); }
  .btn.solid { background: #fff; color: #000; }

  /* ---------- setup ---------- */
  .setup { height: 100%; overflow-y: auto; padding: 56px 22px 40px; user-select: text; -webkit-user-select: text; }
  .setup .lede { margin: 12px 0 26px; max-width: 30ch; font-size: 1.15rem; font-weight: 500; color: var(--t2); }
  .steps { list-style: none; padding: 0; counter-reset: s; border-radius: 24px; overflow: hidden; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 4px 12px; padding: 16px; font-size: .98rem; }
  .steps li + li { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
  .steps li::before { content: counter(s); grid-row: span 3; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: grid; place-items: center; font-size: .82rem; font-weight: 600; }
  .steps li > * { grid-column: 2; }
  .steps a, .linkish { color: #b4d8ff; text-decoration: none; }
  .steps small { color: var(--t2); }
  .field { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
  .field input, .field code { flex: 1; min-width: 0; padding: 13px 14px; border: 0; border-radius: 12px; background: rgba(0, 0, 0, .34); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); color: #fff; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .82rem; letter-spacing: 0; overflow-wrap: anywhere; }
  .field input { font-size: 1rem; } /* under 16px, iPhones zoom the page on focus */
  .field input::placeholder { color: var(--t3); }
  .field .btn { height: auto; padding: 0 16px; font-size: .92rem; background: rgba(255, 255, 255, .16); }
  .setup form .btn { width: 100%; margin-top: 10px; }
  .linkish { display: block; background: none; border: 0; padding: 0; cursor: pointer; margin-top: 22px; font-weight: 500; }
  .msg { margin: 0 0 18px; padding: 13px 16px; border-radius: 16px; background: rgba(255, 69, 58, .2); box-shadow: inset 0 0 0 1px rgba(255, 105, 97, .45); font-size: .95rem; }

  /* ---------- story chrome ---------- */
  .bars { position: absolute; z-index: 5; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; }
  .bars i { flex: 1; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .28); }
  .bars b { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; }
  .bars .done b, .noauto .bars .cur b { width: 100%; }
  .bars .cur b { animation: fill var(--dur) linear forwards; }
  .noauto .bars .cur b { animation: none; }
  @keyframes fill { to { width: 100%; } }
  .held .bars .cur b { animation-play-state: paused; }
  .mute { position: absolute; z-index: 5; top: 26px; right: 14px; width: 38px; height: 38px; border: 0; border-radius: 50%; cursor: pointer; display: none; place-items: center; }
  .hasclips .mute { display: grid; }
  .mute svg { width: 20px; height: 20px; }
  .mute[aria-pressed="true"] .wave { display: none; } .mute[aria-pressed="false"] .cross { display: none; }
  .nav { position: absolute; z-index: 2; top: 0; bottom: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nav.prev { left: 0; width: 30%; } .nav.next { right: 0; width: 70%; }
  .nav:focus-visible { outline-offset: -6px; }

  .slide { position: absolute; inset: 0; padding: 70px 22px 30px; display: flex; flex-direction: column; justify-content: center; }
  .slide.hero { align-items: center; text-align: center; }
  .slide.cover { justify-content: flex-end; }
  .slide > * { position: relative; z-index: 1; }
  .slide .act { z-index: 3; } /* anything tappable sits above the nav zones */

  /* artwork in full colour, lit from behind by a blurred copy of itself */
  .art { position: relative; isolation: isolate; width: min(74%, 40dvh); aspect-ratio: 1; margin-bottom: 34px; border-radius: 26px; animation: art 1.1s var(--ease) both, breathe 7s 1.1s ease-in-out infinite; }
  .art.round { border-radius: 50%; }
  .art img, .art .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .art img:not(.glow), .art .ph { box-shadow: 0 30px 60px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .12); }
  .art .glow { z-index: -1; transform: translateY(7%) scale(1.14); filter: blur(44px) saturate(1.7); opacity: .8; }
  .art .ph { display: grid; place-items: center; background: rgba(255, 255, 255, .12); }
  .art .ph svg { width: 34%; opacity: .7; }
  @keyframes art { from { opacity: 0; transform: scale(.86); filter: blur(10px); } }
  @keyframes breathe { 50% { transform: translateY(-6px) scale(1.012); } }

  .np { display: inline-flex; align-items: center; gap: 9px; margin-top: 20px; padding: 9px 16px 9px 14px; border-radius: 999px; font-size: .86rem; font-weight: 600; visibility: hidden; }
  .playing .np { visibility: visible; animation: in .6s var(--ease) both; }
  .eq { display: inline-flex; align-items: center; gap: 2.5px; height: 14px; }
  .eq i { width: 3px; height: 100%; border-radius: 2px; background: currentColor; animation: eq 1s ease-in-out infinite; animation-delay: calc(var(--i) * -.27s); }
  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

  .list { list-style: none; padding: 6px; margin-top: 20px; border-radius: 26px; }
  .row { position: relative; display: grid; grid-template-columns: 22px 48px 1fr 18px; align-items: center; column-gap: 12px; padding: 9px 12px 9px 8px; border-radius: 20px; animation: in .8s var(--ease) both; animation-delay: calc(var(--i) * 80ms + 250ms); transition: background .4s var(--ease); }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 102px; right: 12px; height: 1px; background: rgba(255, 255, 255, .1); }
  .row.on { background: rgba(255, 255, 255, .16); }
  .row.on::before, .row.on + .row::before { background: transparent; }
  .row .n { text-align: center; font-size: .95rem; font-weight: 600; color: var(--t2); font-variant-numeric: tabular-nums; }
  .row img, .row .ph { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: rgba(255, 255, 255, .14); box-shadow: 0 0 0 1px rgba(255, 255, 255, .08); }
  .row .round { border-radius: 50%; }
  .row .tx { min-width: 0; text-align: left; }
  .row .t { font-size: 1.06rem; font-weight: 600; letter-spacing: -.02em; }
  .row .a { font-size: .88rem; color: var(--t2); }
  .row .t, .row .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .row .eq { visibility: hidden; }
  .playing .row.on .eq { visibility: visible; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 1rem; font-weight: 600; animation: in .9s var(--ease) both; animation-delay: calc(var(--i) * 110ms + 600ms); }

  .ranges { display: flex; align-self: stretch; margin-top: 26px; padding: 3px; border-radius: 13px; }
  .ranges button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 10px; font-size: .9rem; font-weight: 500; cursor: pointer; transition: background .3s var(--ease); }
  .ranges button[aria-pressed="true"] { background: rgba(255, 255, 255, .24); font-weight: 600; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
  .play { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 54px; margin-top: 12px; }
  .play svg { width: 17px; height: 17px; }

  .card { position: relative; overflow: hidden; padding: 22px; border-radius: 30px; }
  .card::after { content: ""; position: absolute; inset: -20% -80%; background: linear-gradient(105deg, transparent 44%, rgba(255, 255, 255, .14) 50%, transparent 56%); animation: sheen 6s ease-in-out infinite; pointer-events: none; }
  @keyframes sheen { from { transform: translateX(-60%); } 45%, to { transform: translateX(60%); } }
  .stack { display: flex; margin-bottom: 16px; }
  .stack img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgba(20, 20, 24, .9); }
  .stack img + img { margin-left: -12px; }
  .card h2 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.035em; line-height: 1.08; }
  .card .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .card h3 { font-size: .8rem; font-weight: 600; color: var(--t2); margin-bottom: 7px; }
  .card ol { list-style: none; padding: 0; counter-reset: c; display: grid; gap: 5px; font-size: .92rem; font-weight: 500; }
  .card li { counter-increment: c; display: grid; grid-template-columns: 1.3em 1fr; min-width: 0; }
  .card li::before { content: counter(c); color: var(--t3); font-variant-numeric: tabular-nums; }
  .card li bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .card .g { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .1); font-size: .92rem; color: var(--t2); }
  .card .g strong { color: #fff; font-weight: 600; }
  .rowbtn { display: flex; gap: 10px; margin-top: 22px; }
  .rowbtn .btn { flex: 1; }
  .loading { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
  .loading .big { animation: pulse 2.4s 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="ui"></div>
</main>
<audio id="player" playsinline></audio>
<script>
"use strict";
const REDIRECT = location.origin + location.pathname;
const RANGES = [["short_term", "4 weeks"], ["medium_term", "6 months"], ["long_term", "1 year"]];
const LS = { get: k => { try { return localStorage.getItem("uw_" + k); } catch { return null; } },
             set: (k, v) => { try { v == null ? localStorage.removeItem("uw_" + k) : localStorage.setItem("uw_" + k, v); } catch {} } };
const stage = document.getElementById("stage"), ui = document.getElementById("ui");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// tiny DOM builder; strings always go in as text, never as HTML (Spotify names are untrusted)
function h(tag, props, ...kids) {
  const el = Object.assign(document.createElement(tag), props || {});
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}
const icon = (cls, markup) => { const el = h("span", { className: cls, ariaHidden: "true" }); el.innerHTML = markup; return el; }; // static markup only
const EQ = [0, 1, 2, 3].map(k => `<i style="--i:${k}"></i>`).join("");
const NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="15" r="2.5" fill="currentColor"/></svg>';
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

// ---------- ambient light: three soft colours drifting on black (one small fragment shader) ----------
const PAL = {
  indigo: ["#5e5ce6", "#bf5af2", "#0a84ff"],
  rose:   ["#ff375f", "#bf5af2", "#ff6b3d"],
  amber:  ["#ff9f0a", "#ff375f", "#ffd60a"],
  violet: ["#bf5af2", "#5e5ce6", "#64d2ff"],
  teal:   ["#40c8e0", "#30d158", "#0a84ff"],
  blue:   ["#0a84ff", "#5e5ce6", "#63e6e2"],
};
const GL = (() => {
  const off = { set() {}, kick() {} };
  const cv = document.getElementById("gl"), gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if (!gl) { cv.remove(); return off; }
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform vec2 r; uniform float t, k; uniform vec3 a, b, c;
    float n(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 uv = gl_FragCoord.xy / r, p = (uv - .5) * vec2(r.x / r.y, 1.);
      p += .1 * vec2(sin(p.y * 3.1 + t * .23), cos(p.x * 2.7 - t * .19));
      vec2 q1 = p - vec2(.26 * sin(t * .13), .20 + .24 * cos(t * .11));
      vec2 q2 = p - vec2(.30 * cos(t * .09 + 2.), .02 + .30 * sin(t * .12 + 1.));
      vec2 q3 = p - vec2(.24 * sin(t * .08 + 4.), .34 + .16 * cos(t * .10 + 3.));
      float s = 5.2 - k * 2.2; // a slide change lets the light bloom for a moment
      vec3 col = a * exp(-dot(q1, q1) * s) * .50 + b * exp(-dot(q2, q2) * s) * .36 + c * exp(-dot(q3, q3) * (s + 1.5)) * .30;
      col *= mix(.5, 1., smoothstep(.0, .8, uv.y)); // dimmer toward the bottom, where most text sits
      col += (n(gl_FragCoord.xy) - .5) / 96.;       // dither so dark gradients don't band
      gl_FragColor = vec4(col, 1.);
    }`));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { cv.remove(); return off; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n), u = { r: U("r"), t: U("t"), k: U("k"), c: [U("a"), U("b"), U("c")] };
  const rgb = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16) / 255);
  let to = PAL.indigo.map(rgb), from = to, cur = to, t0 = 0, kick = 0, phase = 3, last = 0;
  function frame(now) {
    const w = Math.max(2, cv.clientWidth >> 1), ht = Math.max(2, cv.clientHeight >> 1); // half resolution: it's all soft light
    if (cv.width !== w || cv.height !== ht) { cv.width = w; cv.height = ht; gl.viewport(0, 0, w, ht); }
    const m = Math.min(1, (now - t0) / 1400), e = m * m * (3 - 2 * m);
    cur = to.map((col, i) => col.map((v, j) => from[i][j] + (v - from[i][j]) * e));
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    kick *= Math.pow(.08, dt); phase += dt * (2 + kick * 5);
    gl.uniform2f(u.r, w, ht); gl.uniform1f(u.t, phase); gl.uniform1f(u.k, kick);
    cur.forEach((col, i) => gl.uniform3fv(u.c[i], col));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduced) requestAnimationFrame(frame);
  }
  if (!reduced) requestAnimationFrame(frame);
  return {
    set(hexes) { from = cur; to = hexes.map(rgb); t0 = performance.now(); if (reduced) { from = to; frame(t0); } },
    kick() { if (!reduced) kick = 1; },
  };
})();
function paint(name) { stage.style.setProperty("--tint", PAL[name][0]); GL.set(PAL[name]); }

// headline that comes into focus word by word
function kin(text, cls, tag = "div") {
  const el = h(tag, { className: cls, dir: "auto" }, h("span", { className: "sr" }, text));
  text.split(/\s+/).filter(Boolean).forEach((word, n) => { const w = h("span", { className: "w", ariaHidden: "true" }, word); w.style.setProperty("--i", n); el.append(w, " "); });
  return el;
}
// step a headline down until its longest word fits the width
function fit(el) { for (const c of ["m", "s", "brk"]) { if (el.scrollWidth <= el.clientWidth + 1) break; el.classList.add(c); } }

// ---------- Spotify login (authorization code + PKCE, no secret, nothing leaves the browser) ----------
async function login(clientId) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  LS.set("client", clientId); LS.set("verifier", verifier); LS.set("state", state);
  location.assign("https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: clientId, response_type: "code", redirect_uri: REDIRECT, scope: "user-top-read",
    code_challenge_method: "S256", code_challenge: challenge, state }));
}

async function finishLogin(q) {
  history.replaceState(null, "", REDIRECT); // drop ?code from the address bar
  if (q.get("error")) throw new Error("Spotify login was cancelled (" + q.get("error") + ").");
  if (!LS.get("state") || q.get("state") !== LS.get("state")) throw new Error("Login didn't start from this page. Connect again.");
  const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT,
      client_id: LS.get("client"), code_verifier: LS.get("verifier") }) });
  const j = await r.json().catch(() => ({}));
  LS.set("verifier", null); LS.set("state", null);
  if (!r.ok) throw new Error("Spotify refused the login: " + (j.error_description || j.error || r.status) + ".");
  // shortcut: no refresh token, a login lasts 1 hour; add refresh if sessions need to outlive that
  LS.set("token", j.access_token); LS.set("expires", String(Date.now() + j.expires_in * 1000));
}
const token = () => (Number(LS.get("expires")) > Date.now() + 5000 ? LS.get("token") : null);
function disconnect() { LS.set("token", null); LS.set("expires", null); showSetup(); }

async function api(path) {
  const r = await fetch("https://api.spotify.com/v1" + path, { headers: { Authorization: "Bearer " + token() } });
  if (r.status === 401) { LS.set("token", null); throw new Error("Your Spotify login expired. Connect again."); }
  if (r.status === 403) throw new Error("Spotify blocked the request. The account that made the Client ID needs Premium, and any other account has to be added under User Management in the Spotify dashboard.");
  if (r.status === 429) throw new Error("Spotify is rate-limiting this app. Try again in a minute.");
  if (!r.ok) { const e = new Error("Spotify returned an error (" + r.status + ")."); e.status = r.status; throw e; }
  return r.json();
}
const topItems = (type, range) => api(`/me/top/${type}?time_range=${range}&limit=50`)
  .catch(e => { if (e.status === 400) return api(`/me/top/${type}?time_range=${range}`); throw e; }) // in case the limit cap changes
  .then(j => j.items || []);

// Genres ranked by how high the artists carrying them sit in your list
function topGenres(artists, n = 5) {
  const score = new Map();
  artists.forEach((a, i) => (a.genres || []).forEach(g => score.set(g, (score.get(g) || 0) + artists.length - i)));
  return [...score].sort((a, b) => b[1] - a[1]).slice(0, n).map(([name, s]) => ({ name, s }));
}

// ---------- song clips: 30-second previews looked up in Apple's public music search (Spotify no longer gives apps previews) ----------
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/\(.*?\)|\[.*?\]| - .*$/g, "").replace(/[^\p{L}\p{N}]+/gu, "");
// right artist first, then right title; never a clip by someone else
function pickClip(results, track) {
  const a = norm(track.artists[0].name), t = norm(track.name);
  if (!a) return null;
  const same = (results || []).filter(r => { const ra = norm(r.artistName); return r.previewUrl && ra && (ra.includes(a) || a.includes(ra)); });
  if (!t) return same[0] || null;
  return same.find(r => norm(r.trackName) === t) || same.find(r => { const rt = norm(r.trackName); return rt && (rt.includes(t) || t.includes(rt)); }) || null;
}
const Sound = (() => {
  const player = document.getElementById("player");
  const SILENCE = "data:audio/wav;base64,UklGRhQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YfAAAACA" + "gICA".repeat(79) + "gIA=";
  const region = ((navigator.language || "").split("-")[1] || "us").toLowerCase();
  const stores = [...new Set([/^[a-z]{2}$/.test(region) ? region : "us", "us"])];
  const key = t => t.name + "|" + t.artists[0].name, found = new Map(), urls = new Map();
  let unlocked = false, want = null;
  async function find(track) {
    for (const cc of stores) {
      const r = await fetch("https://itunes.apple.com/search?" + new URLSearchParams({ media: "music", entity: "song", limit: "10", country: cc, term: (track.name + " " + track.artists[0].name).trim() }));
      if (!r.ok) continue;
      const hit = pickClip((await r.json()).results, track);
      if (hit && /^https:\/\//.test(hit.previewUrl)) return hit.previewUrl;
    }
    return null;
  }
  function lookup(track) {
    const k = key(track);
    if (!found.has(k)) found.set(k, find(track).catch(() => null).then(u => { if (u) { urls.set(k, u); stage.classList.add("hasclips"); } return u; }));
    return found.get(k);
  }
  async function play(track) {
    want = track || null;
    if (!track || !unlocked) return;
    const k = key(track), url = urls.get(k) ?? await lookup(track); // no await when the clip is ready, so play() stays inside the tap
    if (!url || want !== track || player.dataset.k === k) return;
    player.dataset.k = k; player.loop = true; player.src = url;
    player.play().catch(() => { delete player.dataset.k; });
  }
  player.muted = LS.get("muted") === "1";
  player.addEventListener("playing", () => stage.classList.toggle("playing", !!player.dataset.k));
  for (const ev of ["pause", "error", "emptied"]) player.addEventListener(ev, () => stage.classList.remove("playing"));
  document.addEventListener("visibilitychange", () => { if (!player.dataset.k) return; document.hidden ? player.pause() : player.play().catch(() => {}); });
  return {
    lookup, play,
    // phones only let audio start inside a tap: start the wanted clip right now, or a blip of silence to keep the player allowed
    unlock() {
      if (unlocked) return; unlocked = true;
      if (want && urls.has(key(want))) return void play(want);
      player.loop = false; player.src = SILENCE; player.play().catch(() => {});
      if (want) play(want);
    },
    stop() { want = null; delete player.dataset.k; player.pause(); player.removeAttribute("src"); stage.classList.remove("playing", "hasclips"); },
    get muted() { return player.muted; },
    toggle() { player.muted = !player.muted; LS.set("muted", player.muted ? "1" : null); return player.muted; },
  };
})();

// ---------- demo data (invented artists, so no clips) ----------
function demoData() {
  const pic = hue => [{ url: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},85%,62%)"/><stop offset="1" stop-color="hsl(${hue + 70},80%,38%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="68" cy="34" r="30" fill="#fff" opacity=".22"/><circle cx="30" cy="76" r="38" fill="#000" opacity=".18"/></svg>`) }];
  const A = [["Paper Lanterns", ["indie pop", "dream pop"]], ["נמל תעופה", ["israeli indie", "indie pop"]], ["Glass Harbor", ["synthwave"]], ["Odd Tuesday", ["bedroom pop", "indie pop"]], ["The Night Buses", ["post-punk"]], ["Marlo Vance", ["neo soul"]]];
  const artists = A.map(([name, genres], i) => ({ name, genres, images: pic(330 + i * 55) }));
  const T = [["Half Moon Motel", 0], ["לילה לבן", 1], ["Static Summer", 2], ["Kitchen Floor", 3], ["Last Train to Nowhere in Particular", 4], ["Velvet", 5]];
  const tracks = T.map(([name, i]) => ({ name, artists: [{ name: A[i][0] }], album: { images: pic(170 + i * 47) } }));
  return { me: { display_name: "Demo listener" }, artists, tracks };
}

// ---------- screens ----------
let closeStories = null;
function showSetup(message) {
  if (closeStories) { closeStories(); closeStories = null; }
  Sound.stop(); paint("indigo"); ui.className = "";
  const input = h("input", { id: "cid", placeholder: "Client ID", autocomplete: "off", autocapitalize: "off", spellcheck: false, value: LS.get("client") || "" });
  input.setAttribute("aria-label", "Spotify Client ID");
  const copy = h("button", { className: "btn", type: "button", textContent: "Copy" });
  copy.onclick = () => navigator.clipboard.writeText(REDIRECT).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select it"; });
  const form = h("form", null, h("div", { className: "field" }, input), h("button", { className: "btn solid", textContent: "Connect Spotify" }));
  form.onsubmit = e => {
    e.preventDefault();

  };

  ui.replaceChildren(h("div", { className: "setup" },
    kin("Unwrapped", "big", "h1"),

    h("ol", { className: "steps glass in" },
      h("li", null, h("span", null, "Create an app in the ", link("https://developer.spotify.com/dashboard", "Spotify developer dashboard"), ". Any name works. Tick “Web API”."),
        h("small", null, "Spotify only allows this on Premium accounts.")),
      h("li", null, h("span", null, "Paste this as the app's Redirect URI and save."),
        h("div", { className: "field" }, h("code", null, REDIRECT), copy)),
      h("li", null, h("span", null, "Paste the app's Client ID here."), form)),
    h("button", { className: "linkish", type: "button", textContent: "See a demo with made-up music", onclick: () => showStories(demoData, true) }),
    h("p", { className: "fine" }, "Your Client ID and login stay in this browser. This page has no server. To play clips, the names of your top songs are looked up in Apple's music search.")));
  fit(ui.querySelector(".big"));
}

async function showStories(load, demo) {
  let range = "long_term", i = 0, slides = [], leave = null;
  paint("indigo"); ui.className = "noauto";
  ui.replaceChildren(h("div", { className: "loading" }, kin("Reading your year", "big s")));

  const build = d => {
    const { me, artists, tracks } = d, genres = topGenres(artists), top5 = tracks.slice(0, 5);
    const label = RANGES.find(r => r[0] === range)[1], year = new Date().getFullYear();
    const first = (me.display_name || "").split(/\s+/)[0];
    const who = t => t.artists.map(a => a.name).join(", ");
    const artwork = (list, round) => { const u = list && list[0] && list[0].url;
      return h("div", { className: "art" + (round ? " round" : "") }, u ? [h("img", { className: "glow", src: u, alt: "", ariaHidden: "true" }), h("img", { src: u, alt: "" })] : icon("ph", NOTE)); };
    const kicker = (text, d) => { const el = h("p", { className: "kicker in" }, text); el.style.setProperty("--d", (d || 0) + "ms"); return el; };
    const late = (el, ms) => (el.style.setProperty("--d", ms + "ms"), el); // let the picture land before the words
    const np = () => h("p", { className: "np glass" }, icon("eq", EQ), "Preview");
    const row = (k, list, title, sub, round) => { const im = list && (list[1] || list[0]);
      const li = h("li", { className: "row" }, h("span", { className: "n" }, k + 1),
        im ? h("img", { src: im.url, alt: "", className: round ? "round" : "" }) : h("span", { className: "ph" + (round ? " round" : "") }),
        h("div", { className: "tx" }, h("div", { className: "t", dir: "auto" }, title), sub ? h("div", { className: "a", dir: "auto" }, sub) : null), icon("eq", EQ));
      li.style.setProperty("--i", k); return li; };
    // the clip behind the number one artist: their best-ranked song in your list, else anything by them
    const artistTrack = artists[0] && (tracks.find(t => t.artists.some(a => a.name === artists[0].name)) || { name: "", artists: [{ name: artists[0].name }] });
    if (!demo) [artistTrack, ...top5].filter(Boolean).forEach(Sound.lookup);

    const out = [];
    out.push({ pal: "indigo", cls: "cover", body: () => [
      kicker("Hi " + (first || "there") + (demo ? " (demo)" : "")),
      kin(range === "long_term" ? "Your year in music. Early." : "Your last " + label + " in music.", "big", "h1"),
      h("div", { className: "ranges glass act in", role: "group", ariaLabel: "Period" }, RANGES.map(([key, text]) => {
        const b = h("button", { type: "button", textContent: text, onclick: () => { range = key; start(); } });
        b.setAttribute("aria-pressed", String(key === range)); return b; })),
      h("button", { className: "btn solid play act in", type: "button", onclick: e => go(1, e) }, icon("", '<svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg>'), "Play"),
      h("p", { className: "fine in" }, "Tap right to skip, left to go back, hold to pause.")] });
    if (!artists.length && !tracks.length) {
      out.push({ pal: "amber", body: () => [kin("Not enough listening yet.", "big m", "h1"), h("p", { className: "sub in" }, "Spotify has no ranking for this period. Go back and pick another one.")] });
      return out;
    }
    if (artists[0]) out.push({ pal: "rose", cls: "hero", dur: 10, clip: artistTrack, body: () => [
      artwork(artists[0].images, true), kicker("Your number one artist", 450), late(kin(artists[0].name, "big"), 550), np()] });
    if (artists.length > 1) out.push({ pal: "amber", dur: 9, body: () => [
      kicker("The five you kept coming back to"), kin("Your top artists", "big m", "h1"),
      h("ol", { className: "list glass" }, artists.slice(0, 5).map((a, k) => row(k, a.images, a.name, null, true)))] });
    if (genres.length) out.push({ pal: "violet", cls: "hero", dur: 8, body: () => [
      kicker("What it all sounded like"), kin(genres[0].name, "big"),
      h("div", { className: "chips" }, genres.slice(1).map((g, k) => { const c = h("span", { className: "chip glass", dir: "auto" }, g.name); c.style.setProperty("--i", k); return c; }))] });
    if (tracks[0]) out.push({ pal: "teal", cls: "hero", dur: 12, clip: tracks[0], body: () => [
      artwork(tracks[0].album && tracks[0].album.images), kicker("The song you couldn't leave alone", 450), late(kin(tracks[0].name, "big"), 550),
      late(h("p", { className: "sub in", dir: "auto" }, who(tracks[0])), 800), np()] });
    if (tracks.length > 1) out.push({ pal: "blue", dur: top5.length * 4, clip: tracks[0], body: () => [
      kicker("On repeat"), kin("Your top songs", "big m", "h1"),
      h("ol", { className: "list glass" }, top5.map((t, k) => row(k, t.album && t.album.images, t.name, who(t))))],
      // walk down the list, lighting each row while its clip plays
      enter: root => { const rows = [...root.querySelectorAll(".row")]; let k = -1;
        const pick = n => { k = n; rows.forEach((r, j) => r.classList.toggle("on", j === k)); Sound.play(top5[k]); };
        pick(0); const iv = setInterval(() => { if (!stage.classList.contains("held")) pick((k + 1) % rows.length); }, 4000);
        return () => clearInterval(iv); } });
    out.push({ pal: "rose", clip: tracks[0] || undefined, body: () => { const faces = artists.slice(0, 5).filter(a => a.images && a.images[0]); return [
      h("div", { className: "card glass in" },
        faces.length ? h("div", { className: "stack" }, faces.map(a => h("img", { src: (a.images[1] || a.images[0]).url, alt: "" }))) : null,
        h("h2", null, (first ? first + "’s " : "My ") + (range === "long_term" ? year + " so far" : "last " + label)),
        h("div", { className: "cols" },
          h("div", null, h("h3", null, "Top artists"), h("ol", null, artists.slice(0, 5).map(a => h("li", null, h("bdi", null, a.name))))),
          h("div", null, h("h3", null, "Top songs"), h("ol", null, top5.map(t => h("li", null, h("bdi", null, t.name)))))),
        genres[0] ? h("p", { className: "g" }, "Top genre ", h("strong", null, genres[0].name)) : null),
      late(h("div", { className: "rowbtn act in" },
        h("button", { className: "btn glass", type: "button", textContent: "Start over", onclick: e => go(0, e) }),
        h("button", { className: "btn glass", type: "button", textContent: demo ? "Back to setup" : "Disconnect", onclick: () => (demo ? showSetup() : disconnect()) })), 300),
      late(h("p", { className: "fine in" }, "Take a screenshot to share. Spotify doesn't give apps minutes listened or play counts, so those only arrive with the real Wrapped. Clips are Apple Music previews."), 400)]; } });
    return out;
  };

  const nav = (cls, label, step) => {
    const b = h("button", { className: "nav " + cls, ariaLabel: label }); let t, held = false;
    b.onpointerdown = () => { held = false; t = setTimeout(() => { held = true; stage.classList.add("held"); }, 220); };
    b.onpointerup = b.onpointercancel = b.onpointerleave = () => { clearTimeout(t); stage.classList.remove("held"); };
    b.onclick = e => { if (held) return void (held = false); go(i + step, e); }; // a long press only pauses
    b.oncontextmenu = e => e.preventDefault();
    return b;
  };
  const muteBtn = () => {
    const b = h("button", { className: "mute glass act", type: "button", ariaLabel: "Mute clips" });
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path class="cross" d="M17 9.5l5 5m0-5l-5 5"/></svg>';
    b.setAttribute("aria-pressed", String(Sound.muted));
    b.onclick = () => b.setAttribute("aria-pressed", String(Sound.toggle()));
    return b;
  };
  function go(n, e) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (!slides.length || (n === i && e)) return;
    if (leave) { leave(); leave = null; }
    i = n; const s = slides[i];
    if (s.clip !== undefined) Sound.play(s.clip);
    if (e) Sound.unlock(); // inside the tap, so the phone lets sound start
    paint(s.pal); GL.kick();
    const cur = h("b");
    ui.className = s.dur && !reduced ? "" : "noauto"; ui.style.setProperty("--dur", (s.dur || 0) + "s");
    const slide = h("section", { className: "slide " + (s.cls || "") }, s.body());
    ui.replaceChildren(h("div", { className: "bars" }, slides.map((_, k) => h("i", { className: k < i ? "done" : k === i ? "cur" : "" }, k === i ? cur : h("b")))),
      muteBtn(), slide, nav("prev", "Previous", -1), nav("next", "Next", 1));
    cur.onanimationend = () => go(i + 1);
    slide.querySelectorAll(".big").forEach(fit);
    if (s.enter) leave = s.enter(slide);
  }
  const start = async () => {
    try { Sound.play(null); slides = build(await load(range)); go(0); }
    catch (e) { showSetup(e.message); }
  };
  const onKey = e => { if (!slides.length) return; if (e.key === "ArrowRight") go(i + 1, e); if (e.key === "ArrowLeft") go(i - 1, e); };
  const onHide = () => stage.classList.toggle("held", document.hidden);
  document.addEventListener("keydown", onKey); document.addEventListener("visibilitychange", onHide);
  closeStories = () => { if (leave) leave(); slides = []; stage.classList.remove("held");
    document.removeEventListener("keydown", onKey); document.removeEventListener("visibilitychange", onHide); };
  start();
}

const loadReal = async range => {
  const [me, artists, tracks] = await Promise.all([api("/me"), topItems("artists", range), topItems("tracks", range)]);
  return { me, artists, tracks };
};

(async function boot() {
  const q = new URLSearchParams(location.search);
  try {
    if (q.has("code") || q.has("error")) await finishLogin(q);
  } catch (e) { return showSetup(e.message); }
  if (q.has("demo")) return showStories(demoData, true);
  token() ? showStories(loadReal, false) : showSetup();
})();
